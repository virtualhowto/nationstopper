name: Deploy Nation Stopper
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    name: Verify static game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check game.js
          node --check ui-v2.js
      - name: Simulate complete race
        run: node smoke-test.cjs
      - name: Verify upgraded UI
        run: node ui-smoke-test.cjs
      - name: Verify files
        run: |
          test -s index.html
          test -s styles.css
          test -s game.js
          test -s favicon.svg
          test -s ui-v2.css
          test -s ui-v2.js
          grep -q "raceCanvas" index.html
          grep -q "RACE_LENGTH=3200" game.js
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4